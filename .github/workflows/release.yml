name: Release

on:
  # Automatic: pushing a vX.Y.Z tag.
  push:
    tags:
      - "v*.*.*"
  # Manual: Actions tab → Release → "Run workflow".  Releases whatever
  # version is currently in src/terranova/metadata.txt (override with the
  # optional input).  The version MUST already be committed.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.3 (blank = use metadata.txt). Must already be committed."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    name: Build .zip, GitHub Release, publish to plugins.qgis.org
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # qgis-plugin-ci needs full history + tags

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Work out the version + tag for both trigger types.  On a tag push
      # the tag is authoritative.  On manual dispatch we take the input, or
      # fall back to metadata.txt, and require it to match metadata.txt so
      # we never publish a version that isn't actually committed.
      - name: Resolve version and tag
        id: ver
        run: |
          META=$(grep '^version=' src/terranova/metadata.txt | cut -d= -f2 | tr -d '[:space:]')
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
            [ -z "$VERSION" ] && VERSION="$META"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [ "$VERSION" != "$META" ]; then
            echo "::error::Requested version $VERSION but src/terranova/metadata.txt is $META. Bump + commit (scripts/sync_version.py --bump $VERSION) before releasing."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION"    >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION"

      - name: Build web tier
        working-directory: src/terranova/ui_web
        run: |
          npm ci || npm install
          npm run build

      - name: Warn if committed web bundle looks stale
        run: |
          if ! git diff --quiet -- src/terranova/ui_web/dist; then
            echo "::warning::src/terranova/ui_web/dist differs from a fresh build — if you changed UI source, rebuild + commit dist before releasing."
            git --no-pager diff --stat -- src/terranova/ui_web/dist
          else
            echo "Committed web bundle matches a fresh build."
          fi

      - name: Verify version sync
        run: python scripts/sync_version.py

      - name: Package
        run: make package

      # On manual dispatch there's no tag yet.  Create a LOCAL lightweight
      # tag at the current commit so qgis-plugin-ci's `git archive` (below)
      # has a ref to package.  The REMOTE tag is created by the GitHub
      # Release step.  (On a tag push this is a harmless no-op — the tag
      # already exists.)
      - name: Ensure local tag exists
        run: git tag "${{ steps.ver.outputs.tag }}" 2>/dev/null || true

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: dist/terranova-*.zip
          generate_release_notes: true

      # Publish the version to plugins.qgis.org with the per-plugin API
      # token.  Skips cleanly (does NOT fail) when the token isn't set.
      # Adding a version requires the plugin record to already exist on
      # plugins.qgis.org (created via the web form once + first approval).
      - name: Publish to plugins.qgis.org
        env:
          QGIS_TOKEN: ${{ secrets.QGIS_TOKEN }}
        run: |
          if [ -z "$QGIS_TOKEN" ]; then
            echo "::notice::QGIS_TOKEN secret not set — skipping plugins.qgis.org upload."
            exit 0
          fi
          python -m pip install --upgrade qgis-plugin-ci
          # -c/--allow-uncommitted-changes: the build + package steps dirty
          # the tree (regenerated dist, npm touching package-lock).  This
          # stashes that and archives the committed tag, which already
          # carries the correct dist bundle, metadata.txt and LICENSE.
          qgis-plugin-ci release "${{ steps.ver.outputs.version }}" \
            --release-tag "${{ steps.ver.outputs.tag }}" \
            --allow-uncommitted-changes \
            --qgis-token "$QGIS_TOKEN"
