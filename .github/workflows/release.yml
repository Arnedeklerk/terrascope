name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build .zip, GitHub Release, publish to plugins.qgis.org
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # qgis-plugin-ci reads git history + tags; a shallow clone breaks it.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Rebuild the web bundle and fail loudly if it differs from what's
      # committed — the committed src/terranova/ui_web/dist is what ends up
      # in the published plugin (qgis-plugin-ci archives tracked files), so
      # a stale commit would ship a stale UI.
      - name: Build web tier
        working-directory: src/terranova/ui_web
        run: |
          npm ci || npm install
          npm run build

      # Warn (don't fail) if the committed bundle differs from a fresh
      # build.  A real diff usually means "UI source changed but dist
      # wasn't rebuilt + committed".  It's only a warning because Vite
      # output can differ trivially across OS / node patch versions, and
      # we don't want that to block a legitimate release.  The committed
      # dist is what actually ships (qgis-plugin-ci archives the tag).
      - name: Warn if committed web bundle looks stale
        run: |
          if ! git diff --quiet -- src/terranova/ui_web/dist; then
            echo "::warning::src/terranova/ui_web/dist differs from a fresh build — if you changed UI source, rebuild + commit dist before tagging."
            git --no-pager diff --stat -- src/terranova/ui_web/dist
          else
            echo "Committed web bundle matches a fresh build."
          fi

      - name: Verify version sync
        run: python scripts/sync_version.py

      - name: Package
        run: make package

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/terranova-*.zip
          generate_release_notes: true

      # Publish the new version to plugins.qgis.org with the per-plugin API
      # token (preferred over OSGeo username/password — scoped + revocable).
      # Skips cleanly (does NOT fail the run) when the token secret is unset,
      # so tagging still cuts a GitHub release before credentials exist.
      #
      # The very first version of a brand-new plugin must be created once via
      # the web form (https://plugins.qgis.org/plugins/add/) and approved by a
      # moderator.  After the plugin record exists, every tag auto-publishes.
      - name: Publish to plugins.qgis.org
        env:
          QGIS_TOKEN: ${{ secrets.QGIS_TOKEN }}
        run: |
          if [ -z "$QGIS_TOKEN" ]; then
            echo "::notice::QGIS_TOKEN secret not set — skipping plugins.qgis.org upload."
            exit 0
          fi
          python -m pip install --upgrade qgis-plugin-ci
          # -c / --allow-uncommitted-changes: the earlier build + package
          # steps leave the working tree dirty (regenerated dist, npm
          # touching package-lock).  This flag makes qgis-plugin-ci stash
          # that and archive the committed tag instead — which already
          # contains the correct dist bundle + metadata.txt.
          qgis-plugin-ci release "${GITHUB_REF_NAME#v}" \
            --release-tag "$GITHUB_REF_NAME" \
            --allow-uncommitted-changes \
            --qgis-token "$QGIS_TOKEN"
